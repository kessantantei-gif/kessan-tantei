name: Diagnose external data sources

on:
  push:
    branches:
      - agent/fix-scheduled-data-pipelines-20261028
    paths:
      - ".github/workflows/diagnose-external-sources.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect JPX listing page and EDINET API
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request, urllib.parse, json
          ua={"User-Agent":"kessan-tantei-source-diagnostic/1.0"}
          page="https://www.jpx.co.jp/markets/statistics-equities/misc/01.html"
          req=urllib.request.Request(page,headers=ua)
          html=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
          print("JPX_PAGE_BYTES",len(html))
          for m in re.findall(r'href=["\']([^"\']+)["\']',html,re.I):
              low=m.lower()
              if any(x in low for x in [".xls",".xlsx",".csv","clientportal"]):
                  print("JPX_HREF",urllib.parse.urljoin(page,m))
          key=os.environ.get("EDINET_API_KEY","")
          url="https://api.edinet-fsa.go.jp/api/v2/documents.json?date=2026-10-27&type=2&Subscription-Key="+urllib.parse.quote(key)
          req=urllib.request.Request(url,headers=ua)
          body=urllib.request.urlopen(req,timeout=20).read()
          print("EDINET_BYTES",len(body),"PREFIX",body[:80])
          data=json.loads(body)
          print("EDINET_RESULTS",len(data.get("results",[])))
          PY
