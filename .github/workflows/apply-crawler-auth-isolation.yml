name: Apply Crawler Auth Isolation

on:
  push:
    branches:
      - agent/search-crawler-clerk-isolation
    paths:
      - ".github/workflows/apply-crawler-auth-isolation.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-crawler-clerk-isolation

      - name: Replace crawler-sensitive Clerk server imports
        shell: python
        run: |
          from pathlib import Path
          import re

          allowed = {"auth", "currentUser", "clerkClient"}
          changed = []
          skipped = []

          for root in [Path("app"), Path("lib")]:
              for path in root.rglob("*"):
                  if path.suffix not in {".ts", ".tsx"}:
                      continue
                  if path.as_posix() == "lib/clerk-server.ts":
                      continue

                  text = path.read_text()
                  original = text

                  pattern = re.compile(
                      r'import\s*\{(?P<names>[^}]+)\}\s*from\s*["\']@clerk/nextjs/server["\'];?'
                  )

                  def replace(match):
                      raw_names = match.group("names")
                      names = set()
                      for item in raw_names.split(","):
                          item = item.strip()
                          if not item:
                              continue
                          names.add(item.split(" as ")[0].strip())
                      if names and names.issubset(allowed):
                          return f'import {{ {raw_names.strip()} }} from "@/lib/clerk-server";'
                      skipped.append((path.as_posix(), sorted(names)))
                      return match.group(0)

                  text = pattern.sub(replace, text)
                  if text != original:
                      path.write_text(text)
                      changed.append(path.as_posix())

          print("Changed files:")
          for path in changed:
              print(" -", path)
          if skipped:
              print("Skipped Clerk server imports (non-wrapper exports):")
              for path, names in skipped:
                  print(" -", path, names)

          if not changed:
              raise SystemExit("No Clerk server imports were migrated")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib
          git commit -m "route public auth checks through crawler-safe Clerk wrapper"
          git push origin HEAD:agent/search-crawler-clerk-isolation
