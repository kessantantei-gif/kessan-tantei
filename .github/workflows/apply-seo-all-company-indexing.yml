name: Apply SEO All Company Indexing

on:
  push:
    branches:
      - agent/seo-all-company-indexing
    paths:
      - scripts/apply-seo-all-company-indexing.mjs
      - .github/workflows/apply-seo-all-company-indexing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/seo-all-company-indexing
          fetch-depth: 0

      - name: Apply company page patch
        run: node scripts/apply-seo-all-company-indexing.mjs

      - name: Commit generated company page
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/company/'[ticker]'/page.tsx
          git commit -m "全上場会社ページをインデックス可能にする"
          git push origin HEAD:agent/seo-all-company-indexing
