name: Apply Quarterly Company Page

on:
  push:
    branches:
      - agent/quarterly-tdnet-pipeline
    paths:
      - scripts/apply-quarterly-company-page.mjs
      - .github/workflows/apply-quarterly-company-page.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/quarterly-tdnet-pipeline
          fetch-depth: 0

      - name: Apply deterministic patch
        run: node scripts/apply-quarterly-company-page.mjs

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/company/'[ticker]'/page.tsx
          git commit -m "会社ページへ四半期累計と前年同期比較を統合"
          git push origin HEAD:agent/quarterly-tdnet-pipeline
