name: Diagnose Fujitsu TDnet

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-fujitsu-tdnet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TDNET_LIST_URL_TEMPLATE: ${{ vars.TDNET_LIST_URL_TEMPLATE }}
      TDNET_LOOKBACK_DAYS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill TDnet disclosures for 2026-07-30
        run: npm run sync:tdnet-quarterly -- 2026-07-30

      - name: Diagnose Fujitsu 6702 rows
        run: npx tsx scripts/diagnose-fujitsu-quarterly.ts
