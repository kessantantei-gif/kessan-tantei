name: Diagnose TDnet Cash Flow

on:
  pull_request:
    paths:
      - "scripts/diagnose-tdnet-cash-flow.ts"
      - ".github/workflows/diagnose-tdnet-cash-flow.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Q2 and annual cash-flow tables
        run: npx tsx scripts/diagnose-tdnet-cash-flow.ts
