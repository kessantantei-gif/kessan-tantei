name: Verify TDnet Backfill Complete

on:
  pull_request:
    paths:
      - "package.json"
      - "lib/tdnet-document-title.ts"
      - "scripts/cleanup-tdnet-non-earnings.ts"
      - "scripts/audit-tdnet-xbrl-availability-v2.ts"
      - "scripts/run-tdnet-quarterly-safe-v2.ts"
      - "scripts/run-tdnet-quarterly-raw-with-repair.ts"
      - ".github/workflows/verify-tdnet-backfill-complete.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TDNET_LIST_URL_TEMPLATE: ${{ vars.TDNET_LIST_URL_TEMPLATE }}
      TDNET_OPERATION_START_DATE: "2026-07-25"
      TDNET_MAX_RANGE_DAYS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore and verify 2026-07-31 with guarded sync v2
        run: npm run sync:tdnet-quarterly -- 2026-07-31

      - name: Remove historical supplemental materials and notices
        run: npm run cleanup:tdnet-non-earnings -- --from=2026-07-25 --to=2026-07-31

      - name: Audit TDnet disclosures and quarterly rows
        env:
          TDNET_AUDIT_REPORT_PATH: tdnet-final-audit.json
        run: npm run audit:tdnet-ingestion -- --from=2026-07-25 --to=2026-07-31

      - name: Audit actual earnings XBRL availability
        run: npm run audit:tdnet-xbrl -- --from=2026-07-25 --to=2026-07-31

      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdnet-final-audit
          path: tdnet-final-audit.json
          if-no-files-found: error
          retention-days: 90
