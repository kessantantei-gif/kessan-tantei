name: Apply Root Canonical Audit Fix

on:
  push:
    branches:
      - agent/fix-missing-static-canonicals
    paths:
      - ".github/workflows/apply-root-canonical-audit-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-missing-static-canonicals

      - name: Normalize root canonical expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/verify-production-indexability.ts")
          text = path.read_text()
          old = '    const expectedUrl = `${SITE_URL}${path}`;\n    const result = await fetchText(expectedUrl);'
          new = '    const expectedUrl = path === "/" ? SITE_URL : `${SITE_URL}${path}`;\n    const result = await fetchText(expectedUrl);'
          if old not in text:
              raise SystemExit("expectedUrl block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit audit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-production-indexability.ts
          git commit -m "normalize root canonical in production audit"
          git push origin HEAD:agent/fix-missing-static-canonicals
