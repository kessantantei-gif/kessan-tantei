name: Verify residual pipeline repairs

on:
  push:
    branches: [agent/repair-expired-tdnet-gaps]
    paths:
      - ".github/workflows/verify-expired-tdnet-gap-recovery.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      TDNET_OPERATION_START_DATE: "2026-07-25"
      TDNET_GAP_REPAIR_MAX: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit external data source guards
        run: npm run audit:external-data-sources
      - name: Repair missing TDnet quarterly rows
        run: npm run repair:tdnet-audit-gaps
      - name: Strict TDnet ingestion audit
        run: npm run audit:tdnet-ingestion
      - name: Verify EDINET daily analysis without date scan
        run: npx tsx scripts/sync-daily-edinet.ts 2026-10-27
