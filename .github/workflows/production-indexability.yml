name: Production Indexability

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "proxy.ts"
      - "next.config.ts"
      - "vercel.json"
      - "scripts/audit-seo.ts"
      - "scripts/verify-indexable-company-data.ts"
      - "scripts/verify-production-indexability.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-indexability.yml"
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-indexability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_APP_URL: https://kessan-tantei.jp
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed site as Googlebot
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 18); do
            echo "Production indexability attempt ${attempt}/18"
            npm run audit:production-indexability
            result=$?
            if [ "$result" -eq 0 ]; then
              echo "Production indexability verification passed."
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then
              echo "Production may still be deploying; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "Production indexability verification failed after all retries."
          exit 1
