name: Keep Scheduled Workflows Alive

on:
  schedule:
    # Monthly repository activity keeps public-repo scheduled workflows from
    # being auto-disabled after 60 days of inactivity.
    - cron: "17 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-scheduled-workflows-alive.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: scheduled-workflow-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh repository activity without Vercel deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation-keepalive"
          workdir="$(mktemp -d)"
          cd "$workdir"

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Rebuild the controlled branch from the current default branch each
          # month. This keeps vercel.json on the branch, where Vercel sees that
          # automation-keepalive is explicitly excluded from deployments.
          git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "$branch" FETCH_HEAD

          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/scheduled-workflow-keepalive.txt
          git add .github/scheduled-workflow-keepalive.txt
          git commit -q -m "chore: keep scheduled workflows active [skip ci]"
          git push -q --force origin HEAD:"$branch"

      - name: Ensure critical scheduled workflows stay enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          workflows=(
            "daily-data-refresh.yml"
            "all-markets-nightly.yml"
            "all-markets-backfill.yml"
            "tdnet-backfill.yml"
            "quarterly-disclosures.yml"
          )

          for workflow in "${workflows[@]}"; do
            status="$(curl -L --silent --show-error               -o /tmp/enable-workflow-response.txt               -w "%{http_code}"               -X PUT               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable")"

            if [ "$status" != "204" ]; then
              echo "Failed to enable ${workflow}: HTTP ${status}"
              cat /tmp/enable-workflow-response.txt
              exit 1
            fi

            echo "Enabled/confirmed: ${workflow}"
          done
