name: Diagnose SEO Build

on:
  push:
    branches:
      - agent/seo-all-company-indexing
    paths:
      - .github/workflows/diagnose-seo-build.yml
      - scripts/fix-seo-company-duplicate-query.mjs
      - app/sitemap.ts
      - app/company/**
      - components/company-index-placeholder.tsx

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
      STRIPE_LAUNCH_COUPON_ID: ${{ secrets.STRIPE_LAUNCH_COUPON_ID }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-all-company-indexing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply duplicate-query fix
        run: node scripts/fix-seo-company-duplicate-query.mjs
      - name: Capture build result
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          status=$?
          tail -n 160 /tmp/build.log > build-tail.txt
          echo "BUILD_EXIT_STATUS=$status" >> build-tail.txt
          exit 0
      - name: Commit generated fix and diagnostic tail
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/company/'[ticker]'/page.tsx build-tail.txt
          git commit -m "企業ページ重複クエリを修正してビルド確認" || exit 0
          git push origin HEAD:agent/seo-all-company-indexing
# trigger v3
