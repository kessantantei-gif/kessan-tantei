name: Apply Full Sitemap Audit

on:
  push:
    branches:
      - agent/full-sitemap-indexability-audit
    paths:
      - ".github/workflows/apply-full-sitemap-audit.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-sitemap-indexability-audit

      - name: Expand static sitemap URL checks
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/verify-production-indexability.ts")
          text = path.read_text()
          old = '''  const paths = [\n    "/",\n    "/markets",\n    "/latest-earnings",\n    "/companies/growth",\n    "/companies/prime",\n    "/companies/standard",\n  ];'''
          new = '''  const paths = [\n    "/",\n    "/markets",\n    "/latest-earnings",\n    "/standard",\n    "/standard/ranking",\n    "/prime",\n    "/prime/ranking",\n    "/updates",\n    "/news",\n    "/ranking",\n    "/themes",\n    "/features",\n    "/data-quality",\n    "/about-growth",\n    "/pricing",\n    "/legal",\n    "/privacy",\n    "/terms",\n    "/disclaimer",\n    "/companies/growth",\n    "/companies/prime",\n    "/companies/standard",\n  ];'''
          if old not in text:
              raise SystemExit("verifyStaticPages path block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit audit expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-production-indexability.ts
          git commit -m "audit all static sitemap entry points as Googlebot"
          git push origin HEAD:agent/full-sitemap-indexability-audit
