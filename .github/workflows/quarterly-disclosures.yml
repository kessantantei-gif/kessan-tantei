name: Quarterly Disclosures Daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄は直近3日）"
        required: false
        default: ""
  schedule:
    - cron: "20 12 * * *"

concurrency:
  group: quarterly-disclosures-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      TDNET_LIST_URL_TEMPLATE: ${{ vars.TDNET_LIST_URL_TEMPLATE }}
      TDNET_LOOKBACK_DAYS: "3"
      EDINET_SEMIANNUAL_LOOKBACK_DAYS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync TDnet quarterly disclosures
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            npm run sync:tdnet-quarterly -- "${{ inputs.date }}"
          else
            npm run sync:tdnet-quarterly
          fi

      - name: Sync EDINET semiannual reports
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            npm run sync:edinet-semiannual -- "${{ inputs.date }}"
          else
            npm run sync:edinet-semiannual
          fi

      - name: Build verification
        run: npm run build
