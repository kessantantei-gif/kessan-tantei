name: Quarterly Disclosures Daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄は直近3日）"
        required: false
        default: ""
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: tdnet-quarterly-ingestion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      TDNET_LIST_URL_TEMPLATE: ${{ vars.TDNET_LIST_URL_TEMPLATE }}
      TDNET_LOOKBACK_DAYS: "3"
      TDNET_OPERATION_START_DATE: "2026-07-25"
      EDINET_SEMIANNUAL_LOOKBACK_DAYS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and verify TDnet quarterly disclosures
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            npm run sync:tdnet-quarterly -- "${{ inputs.date }}"
          else
            npm run sync:tdnet-quarterly
          fi

      - name: Audit all TDnet data since operation start
        env:
          TDNET_AUDIT_REPORT_PATH: tdnet-ingestion-audit.json
        run: npm run audit:tdnet-ingestion

      - name: Audit TDnet XBRL availability
        run: npm run audit:tdnet-xbrl

      - name: Upload TDnet audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdnet-ingestion-audit-${{ github.run_id }}
          path: tdnet-ingestion-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Sync EDINET semiannual reports
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            npm run sync:edinet-semiannual -- "${{ inputs.date }}"
          else
            npm run sync:edinet-semiannual
          fi

      - name: Build verification
        run: npm run build

      - name: Open or update TDnet failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "TDnet自動取込エラー";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              `自動取込または監査が失敗しました。`,
              `- Workflow: ${context.workflow}`,
              `- Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close recovered TDnet failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "TDnet自動取込エラー";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `自動取込と監査が正常終了したため復旧扱いにします。Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
            }
